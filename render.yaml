# Render blueprint: one always-on Node web service for PayPal Nexus.
# Render → New → Blueprint → pick this repository. Secrets marked `sync: false`
# are typed into Render's dashboard (never committed). See DEPLOY.md.
services:
  - type: web
    name: paypal-nexus
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # PayPal Sandbox (test mode: fake money)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Supabase (data survives restarts and redeploys)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Optional: Gemini for language-model agents (rules engine works without it)
      - key: GEMINI_API_KEY
        sync: false
      # Generated by Render: signing secrets and merchant workspace passcodes
      - key: NEXUS_SIGNING_SECRET
        generateValue: true
      - key: NEXUS_SIM_WEBHOOK_SECRET
        generateValue: true
      - key: NEXUS_MERCHANT_PASSCODE_ATELIER
        generateValue: true
      - key: NEXUS_MERCHANT_PASSCODE_BOLT
        generateValue: true
      - key: NEXUS_MERCHANT_PASSCODE_COVE
        generateValue: true
